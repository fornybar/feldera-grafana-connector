name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: gofmt -d pkg | (! grep .)
      - run: go test ./pkg/...
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run typecheck
      - run: npm run package
      - name: Verify plugin archive
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          package = json.load(open('package.json'))
          plugin_id = 'feldera-datasource-connector'
          version = package['version']
          archive = pathlib.Path(f'artifacts/{plugin_id}-{version}.zip')
          assert archive.is_file(), f'missing {archive}'
          with zipfile.ZipFile(archive) as zipped:
              names = set(zipped.namelist())
              assert f'{plugin_id}/plugin.json' in names
              assert f'{plugin_id}/feldera_datasource_connector_linux_amd64' in names
              plugin = json.loads(zipped.read(f'{plugin_id}/plugin.json'))
              assert plugin['id'] == plugin_id
              assert plugin['info']['version'] == version
          PY

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.value }}"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.publish == 'true'
        run: npm run package
      - if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" artifacts/* \
            --target "$GITHUB_SHA" \
            --generate-notes
